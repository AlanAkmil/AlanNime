<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Sedang Tayang - AlanNime</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <h1>AlanNime</h1>
                <p>Nonton Anime Sub Indo Gratis</p>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Cari anime...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="ongoing.html" class="active"><i class="fas fa-play-circle"></i> Ongoing</a></li>
                <li><a href="completed.html"><i class="fas fa-check-circle"></i> Complete</a></li>
                <li><a href="schedule.html"><i class="fas fa-calendar-alt"></i> Schedule</a></li>
                <li><a href="genre.html"><i class="fas fa-tags"></i> Genre</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="hero" style="height: 150px;">
            <div class="hero-content">
                <h2>Anime Sedang Tayang</h2>
                <p>Daftar anime yang sedang dalam masa tayang</p>
            </div>
        </div>

        <section class="section">
            <div id="ongoingList" class="anime-grid">
                <div class="loading">Memuat anime ongoing...</div>
            </div>

            <div class="pagination">
                <button onclick="loadPage('prev')" id="prevBtn" disabled>
                    <i class="fas fa-chevron-left"></i> Sebelumnya
                </button>
                <span class="current-page" id="currentPage">Halaman 1</span>
                <button onclick="loadPage('next')" id="nextBtn">
                    Selanjutnya <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <!-- Same footer as index.html -->
    </footer>

    <script src="script.js"></script>
    <script>
        let currentPage = 1;
        let totalPages = 1;

        async function loadOngoing(page = 1) {
            try {
                const data = await ui.api.getOngoing(page);
                ui.renderAnimeGrid('ongoingList', data.animeList, true);
                
                currentPage = page;
                totalPages = data.pagination?.totalPages || 1;
                
                document.getElementById('currentPage').textContent = `Halaman ${currentPage}`;
                document.getElementById('prevBtn').disabled = !data.pagination?.hasPrevPage;
                document.getElementById('nextBtn').disabled = !data.pagination?.hasNextPage;
            } catch (error) {
                console.error('Error loading ongoing:', error);
                document.getElementById('ongoingList').innerHTML = 
                    '<div class="loading">Gagal memuat data. Silakan coba lagi.</div>';
            }
        }

        function loadPage(direction) {
            if (direction === 'prev' && currentPage > 1) {
                loadOngoing(currentPage - 1);
            } else if (direction === 'next' && currentPage < totalPages) {
                loadOngoing(currentPage + 1);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            ui.setupSearch();
            loadOngoing(1);
        });
    </script>
</body>
</html>
