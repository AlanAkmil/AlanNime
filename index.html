<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>ClaudeNime — Streaming Donghua & Anime</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0f0817;--surface:rgba(24,15,41,.75);--card:rgba(31,20,51,.8);--card2:rgba(40,25,63,.85);
  --border:#322248;--border2:#3d2a5a;
  --purple:#a25bff;--purple2:#c389ff;--purple-dim:#5a3d80;--purple-bg:#2a1a45;
  --text:#f0eaf8;--text2:#b8a8d0;--muted:#7a6a94;
  --radius:14px;--radius-sm:10px;--nav-h:62px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;overflow-x:hidden}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--purple-dim);border-radius:2px}
#galaxy-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app-wrap{position:relative;z-index:1}

/* ── TOPNAV ── */
#topnav{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--nav-h);
  background:rgba(15,8,23,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.logo{font-family:'Poppins',sans-serif;font-size:18px;font-weight:800;
  background:linear-gradient(135deg,var(--purple),var(--purple2),#ff8aff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px}
.logo-sub{font-size:9px;color:var(--muted);-webkit-text-fill-color:var(--muted);display:block;margin-top:-2px;letter-spacing:1.5px}
.icon-btn{background:var(--card);border:1px solid var(--border);border-radius:50%;
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  backdrop-filter:blur(8px);transition:all .25s var(--ease)}
.icon-btn:active{transform:scale(.9);border-color:var(--purple-dim)}
.icon-btn svg{width:17px;height:17px;stroke:var(--text2);fill:none;stroke-width:2}

/* ── BOTNAV ── */
#botnav{position:fixed;bottom:0;left:0;right:0;z-index:200;height:var(--nav-h);
  background:rgba(15,8,23,.9);backdrop-filter:blur(16px);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;padding:0 4px}
.bnav{display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 8px;cursor:pointer;color:var(--muted);font-size:9px;font-weight:500;
  border:none;background:none;transition:all .25s var(--ease);flex:1;position:relative;border-radius:var(--radius-sm)}
.bnav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;transition:all .25s var(--ease)}
.bnav.active{color:var(--purple2)}
.bnav.active svg{stroke:var(--purple2);filter:drop-shadow(0 0 6px rgba(162,91,255,.6))}
.bnav::after{content:'';position:absolute;bottom:2px;left:50%;width:0;height:3px;
  background:var(--purple);border-radius:2px;transition:all .3s var(--ease);transform:translateX(-50%)}
.bnav.active::after{width:16px}

/* ── APP ── */
#app{padding-top:var(--nav-h);padding-bottom:calc(var(--nav-h)+8px);min-height:100vh}
.section{display:none;animation:fadeIn .3s var(--ease)}
.section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── SHARED ── */
.sh{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 10px}
.sh-title{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--purple);box-shadow:0 0 10px var(--purple);flex-shrink:0}
.sh-more{font-size:12px;color:var(--purple2);cursor:pointer;background:none;border:none;font-weight:600}
.gline{height:1px;background:linear-gradient(to right,transparent,var(--purple-dim),transparent);margin:6px 0}
.tab-row{display:flex;gap:8px;padding:0 18px 14px}
.tab-pill{flex:1;padding:10px 6px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;
  cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted);
  transition:all .25s var(--ease);text-align:center;backdrop-filter:blur(8px)}
.tab-pill.active{background:linear-gradient(135deg,var(--purple),#8a3ffc);color:#fff;
  border-color:transparent;box-shadow:0 4px 16px rgba(162,91,255,.35)}

/* ── HERO SLIDER ── */
.hero-wrap{position:relative;width:100%;height:260px;overflow:hidden;background:var(--bg)}
.hero-track{display:flex;height:100%;transition:transform .5s var(--ease)}
.hero-slide{flex:0 0 100%;position:relative;overflow:hidden;cursor:pointer}
.hero-img{width:100%;height:100%;object-fit:cover;opacity:.7}
.hero-overlay{position:absolute;inset:0;
  background:linear-gradient(to top,var(--bg) 0%,rgba(15,8,23,.3) 50%,transparent 75%),
             linear-gradient(to bottom,rgba(15,8,23,.4) 0%,transparent 30%);
  display:flex;flex-direction:column;justify-content:flex-end;padding:16px 18px 28px}
.hero-badge{display:inline-flex;align-items:center;gap:5px;
  background:linear-gradient(135deg,var(--purple),#ff8aff);color:#fff;font-size:10px;font-weight:700;
  padding:5px 12px;border-radius:20px;margin-bottom:7px;width:fit-content;
  box-shadow:0 4px 16px rgba(162,91,255,.4);animation:badgePulse 2.5s ease-in-out infinite}
@keyframes badgePulse{0%,100%{box-shadow:0 4px 16px rgba(162,91,255,.4)}50%{box-shadow:0 4px 24px rgba(162,91,255,.7)}}
.hero-title{font-family:'Poppins',sans-serif;font-size:21px;font-weight:800;color:#fff;
  margin-bottom:6px;line-height:1.25;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.hero-meta{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--text2)}
.hero-type{background:rgba(162,91,255,.2);color:var(--purple2);padding:3px 10px;
  border-radius:12px;font-size:10px;font-weight:700;border:1px solid var(--purple-dim)}
.hero-dots{position:absolute;bottom:10px;left:18px;display:flex;gap:5px;z-index:2}
.hero-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .35s var(--ease);cursor:pointer}
.hero-dot.active{width:22px;border-radius:3px;background:linear-gradient(90deg,var(--purple),var(--purple2))}

/* ── GRID 3 ── */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;padding:0 18px}
.gc{cursor:pointer;transition:transform .2s var(--ease)}
.gc:active{transform:scale(.95)}
.gc-wrap{position:relative;border-radius:var(--radius-sm);overflow:hidden;width:100%;aspect-ratio:2/3;
  background:var(--card);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.gc-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s var(--ease)}
.gc:active .gc-img{transform:scale(1.06)}
.gc-overlay{position:absolute;bottom:0;left:0;right:0;padding:7px;background:linear-gradient(transparent,rgba(15,8,23,.95))}
.gc-eps{font-size:10px;font-weight:700;color:#fff}
.gc-badge{position:absolute;top:6px;left:6px;background:linear-gradient(135deg,var(--purple),#ff8aff);
  color:#fff;font-size:9px;font-weight:700;padding:3px 7px;border-radius:6px;box-shadow:0 2px 8px rgba(162,91,255,.4)}
.gc-badge.anime{background:linear-gradient(135deg,#ff6b6b,#ff8e53)}
.gc-rating{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);
  color:#ffd700;font-size:9px;font-weight:700;padding:2px 6px;border-radius:6px}
.gc-title{font-size:11.5px;color:var(--text2);margin-top:7px;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35;font-weight:500}

/* ── POPULER LIST ── */
.pop-list{display:flex;flex-direction:column;gap:10px;padding:0 18px}
.pop-item{display:flex;gap:14px;align-items:center;padding:12px;background:var(--card);
  border-radius:var(--radius);border:1px solid var(--border);cursor:pointer;
  backdrop-filter:blur(12px);transition:all .25s var(--ease)}
.pop-item:active{border-color:var(--purple-dim);transform:scale(.98)}
.pop-rank{font-family:'Poppins',sans-serif;font-size:22px;font-weight:800;color:var(--border2);min-width:34px;text-align:center}
.pop-rank.t{color:var(--purple);text-shadow:0 0 16px rgba(162,91,255,.5)}
.pop-img{width:50px;height:70px;object-fit:cover;border-radius:8px;background:var(--border);flex-shrink:0}
.pop-info{flex:1;min-width:0}
.pop-title{font-size:13.5px;font-weight:600;color:var(--text);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-meta{display:flex;gap:7px;align-items:center}
.pop-tag{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:700;
  background:rgba(162,91,255,.15);color:var(--purple2);border:1px solid var(--purple-dim)}

/* ── CONTINUE WATCHING ── */
.cw-scroll{display:flex;gap:12px;padding:0 18px;overflow-x:auto;scrollbar-width:none}
.cw-scroll::-webkit-scrollbar{display:none}
.cw-card{flex:0 0 160px;border-radius:var(--radius);overflow:hidden;background:var(--card);
  border:1px solid var(--border);cursor:pointer;backdrop-filter:blur(12px);transition:transform .2s var(--ease)}
.cw-card:active{transform:scale(.96)}
.cw-thumb{width:100%;height:90px;object-fit:cover;display:block;background:var(--border)}
.cw-bar{height:3px;background:rgba(255,255,255,.08)}
.cw-prog{height:100%;background:linear-gradient(90deg,var(--purple),var(--purple2));width:35%;box-shadow:0 0 8px var(--purple)}
.cw-info{padding:8px 10px}
.cw-ep{font-size:10px;color:var(--purple2);font-weight:700;margin-bottom:2px}
.cw-title{font-size:11.5px;font-weight:600;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}

/* ── SEARCH ── */
.s-bar{padding:16px 18px 0;display:flex;gap:10px}
.s-input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px 16px;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;outline:none;
  backdrop-filter:blur(8px);transition:border-color .25s,box-shadow .25s}
.s-input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(162,91,255,.15)}
.s-input::placeholder{color:var(--muted)}
.s-btn{background:linear-gradient(135deg,var(--purple),#8a3ffc);border:none;border-radius:var(--radius);
  padding:13px 20px;color:#fff;font-weight:700;font-size:13px;cursor:pointer;
  box-shadow:0 4px 16px rgba(162,91,255,.35);transition:transform .2s}
.s-btn:active{transform:scale(.95)}
.sm-tabs{display:flex;gap:8px;padding:10px 18px 0}
.sm-tab{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;
  border:1px solid var(--border);background:var(--card);color:var(--muted);transition:all .25s var(--ease)}
.sm-tab.active{background:linear-gradient(135deg,var(--purple),#8a3ffc);color:#fff;border-color:transparent}

/* ── SCHEDULE ── */
.day-tabs-wrap{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 18px 14px}
.day-tabs-wrap::-webkit-scrollbar{display:none}
.day-tab{flex:0 0 auto;padding:9px 18px;border-radius:24px;font-size:12.5px;font-weight:600;
  cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted);transition:all .25s var(--ease)}
.day-tab.active{background:linear-gradient(135deg,var(--purple),#8a3ffc);color:#fff;
  border-color:transparent;box-shadow:0 4px 16px rgba(162,91,255,.35)}

/* ── PAGINATION ── */
.pagination{display:flex;justify-content:center;gap:12px;padding:20px 18px}
.page-btn{flex:1;max-width:140px;padding:12px;border-radius:var(--radius-sm);background:var(--card);
  border:1px solid var(--border);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;
  backdrop-filter:blur(8px);transition:all .25s var(--ease);text-align:center}
.page-btn:active:not(:disabled){border-color:var(--purple-dim)}
.page-btn:disabled{opacity:.3;cursor:default}

/* ── DETAIL PAGE ── */
#detail-page{display:none;position:fixed;inset:0;z-index:300;background:var(--bg);overflow-y:auto}
#detail-page.open{display:block;animation:slideUp .35s var(--ease)}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.dp-back{position:sticky;top:0;z-index:10;background:rgba(15,8,23,.88);backdrop-filter:blur(16px);
  padding:13px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.back-btn{background:var(--card);border:1px solid var(--border);border-radius:50%;
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex-shrink:0;backdrop-filter:blur(8px);transition:all .25s var(--ease)}
.back-btn:active{transform:scale(.9) translateX(-2px)}
.back-btn svg{width:17px;height:17px;stroke:var(--text);fill:none;stroke-width:2}
.dp-banner{width:100%;height:250px;position:relative;overflow:hidden}
.dp-banner-img{width:100%;height:100%;object-fit:cover}
.dp-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(15,8,23,.1),var(--bg))}
.dp-content{padding:0 18px 28px}
.dp-row{display:flex;gap:16px;margin-top:-55px;position:relative;z-index:2}
.dp-poster{width:96px;height:136px;object-fit:cover;border-radius:var(--radius);
  border:2px solid var(--purple-dim);flex-shrink:0;background:var(--card);
  box-shadow:0 8px 32px rgba(162,91,255,.25)}
.dp-meta{padding-top:60px;flex:1;min-width:0}
.dp-title{font-family:'Poppins',sans-serif;font-size:17px;font-weight:800;color:var(--text);line-height:1.3;margin-bottom:8px}
.dp-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.dp-tag{padding:4px 11px;border-radius:20px;font-size:10.5px;font-weight:700;
  background:rgba(162,91,255,.15);color:var(--purple2);border:1px solid var(--purple-dim)}
.dp-stats{display:flex;gap:12px;flex-wrap:wrap}
.dp-stat{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:4px}
.dp-stat strong{color:var(--purple2);font-weight:700}
.dp-synopsis{font-size:13.5px;line-height:1.75;color:var(--text2);margin:16px 0;
  padding:14px 16px;background:var(--card);border-radius:var(--radius);
  border-left:3px solid var(--purple);backdrop-filter:blur(8px)}
.ep-list-hd{font-family:'Poppins',sans-serif;font-size:15px;font-weight:700;color:var(--text);
  margin:20px 0 12px;display:flex;align-items:center;gap:8px}
.ep-list-hd span{font-size:12px;color:var(--muted);font-weight:400;font-family:'Inter',sans-serif}
.ep-list{display:flex;flex-direction:column;gap:8px}
.ep-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;
  background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border);cursor:pointer;
  backdrop-filter:blur(8px);transition:all .25s var(--ease)}
.ep-row:active{border-color:var(--purple-dim);transform:scale(.98)}
.ep-row-num{font-size:13.5px;font-weight:700;color:var(--purple2);min-width:58px}
.ep-row-title{font-size:12.5px;color:var(--text);flex:1}
.ep-row-date{font-size:10.5px;color:var(--muted);margin-left:8px;flex-shrink:0}
.ep-row-arr{color:var(--muted);font-size:18px;transition:transform .2s}
.ep-row:active .ep-row-arr{transform:translateX(3px);color:var(--purple2)}

/* ── WATCH PAGE ── */
#watch-page{display:none;position:fixed;inset:0;z-index:400;background:#000;overflow-y:auto}
#watch-page.open{display:block;animation:slideUp .35s var(--ease)}
.wp-back{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.88);backdrop-filter:blur(16px);
  padding:13px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #2a1a3f}
#player-wrap{width:100%;aspect-ratio:16/9;background:#0a0512}
#player-frame{width:100%;height:100%;border:none;display:block}
.wp-info{padding:14px 18px 0}
.wp-title{font-family:'Poppins',sans-serif;font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px}
.wp-sub{font-size:12.5px;color:var(--purple2);font-weight:600}
.srv-section{padding:14px 18px}
.srv-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;font-weight:700}
.srv-list{display:flex;flex-wrap:wrap;gap:8px}
.srv-btn{padding:9px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--card);color:var(--text2);font-size:12px;cursor:pointer;font-weight:600;transition:all .25s var(--ease)}
.srv-btn.active{border-color:transparent;color:#fff;background:linear-gradient(135deg,var(--purple),#8a3ffc);box-shadow:0 4px 16px rgba(162,91,255,.35)}
.wp-nav{display:flex;gap:10px;padding:10px 18px 28px}
.ep-nav-btn{flex:1;padding:13px;border-radius:var(--radius-sm);background:var(--card);
  border:1px solid var(--border);color:var(--text2);font-size:12.5px;cursor:pointer;text-align:center;font-weight:600;transition:all .25s var(--ease)}
.ep-nav-btn:active:not(:disabled){border-color:var(--purple-dim)}
.ep-nav-btn:disabled{opacity:.3;cursor:default}

/* ── DOWNLOAD SECTION (Neonime) ── */
.dl-section{padding:0 18px 14px;border-top:1px solid var(--border);margin-top:4px}
.dl-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;
  font-weight:700;padding:14px 0 10px;display:flex;align-items:center;gap:8px}
.dl-format-block{margin-bottom:14px}
.dl-fmt-tag{display:inline-flex;align-items:center;padding:4px 13px;border-radius:12px;
  font-size:10px;font-weight:800;letter-spacing:1px;margin-bottom:9px}
.dl-fmt-tag.mp4{background:rgba(42,107,255,.18);color:#7a9fff;border:1px solid rgba(90,61,255,.4)}
.dl-fmt-tag.mkv{background:rgba(255,107,43,.14);color:#ffaa7a;border:1px solid rgba(255,107,43,.35)}
.dl-quality-item{margin-bottom:10px}
.dl-quality-name{font-size:11.5px;color:var(--text2);font-weight:600;margin-bottom:6px}
.dl-links-wrap{display:flex;flex-wrap:wrap;gap:7px}
.dl-link-a{padding:8px 13px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--card);color:var(--text2);font-size:11.5px;font-weight:600;
  text-decoration:none;transition:all .25s var(--ease);display:inline-flex;align-items:center;gap:5px}
.dl-link-a:active{border-color:var(--purple-dim);color:var(--purple2)}

/* ── BATCH INFO BOX ── */
.batch-info{padding:10px 14px;background:rgba(42,107,255,.1);
  border:1px solid rgba(90,61,255,.4);border-radius:var(--radius-sm);
  margin-bottom:14px;font-size:12.5px;color:#7a9fff;line-height:1.5}

/* ── LOADER/EMPTY ── */
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px;gap:14px}
.spinner{width:38px;height:38px;border-radius:50%;border:3px solid var(--border);
  border-top-color:var(--purple);border-right-color:var(--purple2);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ldr-txt{font-size:12.5px;color:var(--muted);font-weight:500}
.empty{text-align:center;padding:50px 24px;color:var(--muted);font-size:13.5px}
.empty-ico{font-size:40px;margin-bottom:14px;opacity:.6}

/* ── TOAST ── */
#toast{position:fixed;bottom:calc(var(--nav-h)+16px);left:50%;
  transform:translateX(-50%) translateY(20px) scale(.9);background:var(--card2);
  border:1px solid var(--purple-dim);color:var(--text);padding:10px 20px;
  border-radius:var(--radius-sm);font-size:12.5px;font-weight:500;opacity:0;
  transition:all .35s var(--ease);z-index:999;pointer-events:none;white-space:nowrap;
  box-shadow:0 8px 32px rgba(162,91,255,.2);backdrop-filter:blur(8px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
</style>
</head>
<body>
<canvas id="galaxy-canvas"></canvas>
<div id="app-wrap">

<nav id="topnav">
  <div>
    <div class="logo">ClaudeNime</div>
    <span class="logo-sub">DONGHUA & ANIME</span>
  </div>
  <div class="icon-btn" onclick="goSearch()">

// ── GALAXY BACKGROUND ──────────────────────────────────────────────────────
(function(){
  const C=document.getElementById('galaxy-canvas'),ctx=C.getContext('2d');
  let W,H,cx,cy,scrollY=0,targetScrollY=0,mouseX=0,mouseY=0;
  function resize(){W=C.width=window.innerWidth;H=C.height=window.innerHeight;cx=W/2;cy=H/2}
  resize();window.addEventListener('resize',resize);
  window.addEventListener('scroll',()=>{targetScrollY=window.pageYOffset},{passive:true});
  document.addEventListener('mousemove',e=>{mouseX=(e.clientX/W-.5)*2;mouseY=(e.clientY/H-.5)*2});
  function getColor(t,b){let r,g,bl;
    if(t>.85){r=200*b;g=150*b;bl=255*b}else if(t>.65){r=162*b;g=91*b;bl=255*b}
    else if(t>.45){r=120*b;g=50*b;bl=220*b}else if(t>.25){r=80*b;g=30*b;bl=180*b}
    else{r=50*b;g=20*b;bl=120*b}
    return{r:Math.floor(Math.min(255,r)),g:Math.floor(Math.min(255,g)),b:Math.floor(Math.min(255,bl))}}
  const particles=[];
  for(let ring=0;ring<5;ring++){const bR=50+ring*40,sp=(0.003+Math.random()*.002)/(1+ring*.4);
    for(let i=0;i<220;i++){const a=(i/220)*Math.PI*2+Math.random()*.3,r=bR+(Math.random()-.5)*(10+ring*5),yO=(Math.random()-.5)*(3+ring*1.5);
      particles.push({ring,angle:a,r,yOff:yO,size:.4+Math.random()*(1.1-ring*.1),speed:sp,temp:1-ring/5,brightness:.4+Math.random()*.6,type:'disk'})}}
  for(let i=0;i<50;i++){const dir=i<25?-1:1,dist=15+Math.random()*160,spread=(Math.random()-.5)*18*(dist/180);
    particles.push({dir,dist,spread,angle:Math.random()*Math.PI*2,rotSpeed:.01+Math.random()*.02,size:.4+Math.random()*.9,brightness:.3+Math.random()*.5,type:'jet'})}
  for(let i=0;i<300;i++){const a=Math.random()*Math.PI*2,r=80+Math.random()*400;
    particles.push({angle:a,r,yOff:(Math.random()-.5)*220,size:.2+Math.random()*.7,speed:.0004+Math.random()*.0008,brightness:.08+Math.random()*.2,type:'halo'})}
  const stars=[];for(let i=0;i<150;i++)stars.push({x:Math.random(),y:Math.random(),s:Math.random()*1.2,o:Math.random()*.25+.05});
  function rY(x,y,z,a){const c=Math.cos(a),s=Math.sin(a);return{x:x*c-z*s,y,z:x*s+z*c}}
  function rX(x,y,z,a){const c=Math.cos(a),s=Math.sin(a);return{x,y:y*c-z*s,z:y*s+z*c}}
  function drawCore(){
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,110);
    g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.12,'rgba(0,0,0,.95)');
    g.addColorStop(.25,'rgba(90,30,150,.08)');g.addColorStop(.45,'rgba(162,91,255,.04)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();ctx.arc(cx,cy,110,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();ctx.arc(cx,cy,20,0,Math.PI*2);ctx.fillStyle='#000';ctx.fill();
    ctx.beginPath();ctx.arc(cx,cy,24,0,Math.PI*2);ctx.strokeStyle='rgba(162,91,255,.25)';ctx.lineWidth=1.5;ctx.stroke()}
  function animate(){
    scrollY+=(targetScrollY-scrollY)*.05;ctx.clearRect(0,0,W,H);
    for(const s of stars){ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.s,0,Math.PI*2);ctx.fillStyle=`rgba(180,160,255,${s.o})`;ctx.fill()}
    const sa=scrollY*.0006,ax=.82+mouseY*.04+Math.sin(sa*.4)*.12,ay=sa+mouseX*.06,ps=780,pj=[];
    for(const p of particles){let x3,y3,z3,col,al;
      if(p.type==='disk'){p.angle+=p.speed;x3=Math.cos(p.angle)*p.r;z3=Math.sin(p.angle)*p.r;y3=p.yOff;col=getColor(p.temp,p.brightness);al=p.brightness*.7}
      else if(p.type==='jet'){p.angle+=p.rotSpeed;x3=Math.cos(p.angle)*p.spread;z3=Math.sin(p.angle)*p.spread;y3=p.dir*p.dist;col={r:Math.floor(162*p.brightness),g:Math.floor(91*p.brightness),b:255};al=p.brightness*.45*(1-p.dist/180)}
      else{p.angle+=p.speed;x3=Math.cos(p.angle)*p.r;z3=Math.sin(p.angle)*p.r;y3=p.yOff;col={r:100,g:60,b:180};al=p.brightness*.25}
      let r1=rY(x3,y3,z3,ay),r2=rX(r1.x,r1.y,r1.z,ax);const sc=ps/(ps+r2.z);
      pj.push({sx:cx+r2.x*sc,sy:cy+r2.y*sc,sz:r2.z,ss:Math.max(.2,p.size*sc),col,al:al*Math.max(.1,sc)})}
    pj.sort((a,b)=>b.sz-a.sz);
    for(const p of pj)if(p.sz>0)drP(p);drawCore();for(const p of pj)if(p.sz<=0)drP(p);
    requestAnimationFrame(animate)}
  function drP(p){const{sx,sy,ss,col,al}=p;if(sx<-60||sx>W+60||sy<-60||sy>H+60)return;
    ctx.beginPath();ctx.arc(sx,sy,ss,0,Math.PI*2);ctx.fillStyle=`rgba(${col.r},${col.g},${col.b},${al})`;ctx.fill();
    if(ss>.9&&al>.2){ctx.beginPath();ctx.arc(sx,sy,ss*3,0,Math.PI*2);ctx.fillStyle=`rgba(${col.r},${col.g},${col.b},${al*.07})`;ctx.fill()}}
  animate();
})();

// ── ENDPOINTS & GLOBALS ────────────────────────────────────────────────────

// ── NEONIME HELPERS ────────────────────────────────────────────────────────
// Neonime list items: {title, link, img, eps, score}
// → normalize ke format umum
function nnNorm(items){
  return (items||[]).map(i=>({
    title: i.title||'',
    url:   i.link||i.url||'',
    thumbnail: i.img||i.thumbnail||i.poster||i.image||'',
    episode: i.eps||i.episode||'',
    rating: i.score ? (String(i.score).startsWith('★') ? i.score : `★ ${i.score}`) : (i.rating||'')
  }));
}

// URL Neonime series → slug bersih
// "https://otakupoi.org/neonime/nekopara-subtitle-indonesia/" → "nekopara-subtitle-indonesia"
function nnSlug(url){
  if(!url)return'';
  return url.replace(/^https?:\/\/[^/]+\//,'').replace(/^neonime\//,'').replace(/\/$/,'');
}

// Parse URL episode Neonime → {slug, ep}
// "https://otakupoi.org/watch/nekopara-1x1" → {slug:"nekopara", ep:1}
function parseNNEp(url){
  if(!url)return null;
  const m = url.match(/\/watch\/(.+)-(\d+)x\d+/);
  return m ? {slug:m[1], ep:parseInt(m[2])} : null;
}

// ── OTAKUDESU HELPERS ──────────────────────────────────────────────────────
// List items dari OtakuDesu shape-nya sama persis dengan Neonime
// {title, link, img, eps, score} → bisa pakai nnNorm() langsung.

// URL OtakuDesu series → slug bersih
// "https://otakudesu.news/ds-future-part3-sub-indo/" → "ds-future-part3-sub-indo"
function odSlug(url){
  if(!url)return'';
  return url.replace(/^https?:\/\/[^/]+\//,'').replace(/\/$/,'');
}

// Parse URL episode OtakuDesu → {slug, ep}
// "https://nontonanimex.com/episode/drstn-s4-p3-episode-1-sub-indo/" → {slug:"drstn-s4-p3", ep:1}
function parseODEp(url){
  if(!url)return null;
  const m = url.match(/\/episode\/(.+)-episode-(\d+)-sub-indo/);
  return m ? {slug:m[1], ep:parseInt(m[2])} : null;
}

// ── UTILS ──────────────────────────────────────────────────────────────────
async function apiGet(base,p){
  const r = await fetch(`${base}?${new URLSearchParams(p)}`);
  let body=null;
  try{ body = await r.json(); }catch{ body=null; }
  if(!r.ok){
    const msg = (body && body.error) ? body.error : ("HTTP "+r.status);
    throw new Error(msg);
  }
  return body;
}
function toast(m){
  const t=document.getElementById("toast");
  t.textContent=m; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2200);
}
function slug(url){return url?url.replace(/^https?:\/\/[^/]+\//,"").replace(/\/$/,""):""}

// ── CACHE LAYER (localStorage) ──────────────────────────────────────────────
// Browse/home data di-cache biar buka web berikutnya gak perlu nunggu API lagi.
// Search, detail, dan watch/episode TIDAK di-cache (harus selalu fresh).
const CACHE_VERSION="v1";
const CACHE_PREFIX=`cn_cache_${CACHE_VERSION}_`;
const CACHE_TTL=15*60*1000; // 15 menit

function cacheGet(key){
  try{
    const raw=localStorage.getItem(CACHE_PREFIX+key);
    if(!raw)return null;
    const {t,data}=JSON.parse(raw);
    return {data, fresh:(Date.now()-t)<CACHE_TTL};
  }catch{return null}
}
function cacheSet(key,data){
  try{localStorage.setItem(CACHE_PREFIX+key,JSON.stringify({t:Date.now(),data}))}catch{}
}
// Ambil data: pakai cache kalau masih fresh (skip network sama sekali),
// kalau expired/gak ada → fetch baru lalu simpan ke cache.
// Kalau fetch gagal tapi ada cache lama (meski expired), pakai itu sebagai fallback.
async function cachedApiGet(base,p,cacheKey){
  const cached=cacheGet(cacheKey);
  if(cached&&cached.fresh)return cached.data;
  try{
    const d=await apiGet(base,p);
    cacheSet(cacheKey,d);
    return d;
  }catch(e){
    if(cached)return cached.data; // fallback ke cache lama daripada gagal total
    throw e;
  }
}

// ── HISTORY ────────────────────────────────────────────────────────────────
function getHist(){try{return JSON.parse(localStorage.getItem(HIST_KEY)||"[]")}catch{return[]}}
function saveHist(h){localStorage.setItem(HIST_KEY,JSON.stringify(h))}
function addHist(slugVal,epTitle,seriesTitle,thumb,type){
  let h=getHist().filter(x=>x.slug!==slugVal);
  h.unshift({slug:slugVal,epTitle,seriesTitle,thumb,type:type||"donghua",ts:Date.now()});
  saveHist(h.slice(0,12));
}
function clearHistory(){saveHist([]);renderCW()}
function renderCW(){
  const h=getHist(),sec=document.getElementById("cw-section"),list=document.getElementById("cw-list");
  if(!h.length){sec.style.display="none";return}
  sec.style.display="block";
  list.innerHTML=h.map(i=>{
    let fn;

    else fn=`openWatch('${encodeURIComponent(i.slug)}')`;

      <img class="cw-thumb" src="${IMG(i.thumb)}" onerror="this.style.background='var(--card2)'" loading="lazy"/>
      <div class="cw-bar"><div class="cw-prog"></div></div>
      <div class="cw-info"><div class="cw-ep">${i.epTitle||""}</div><div class="cw-title">${i.seriesTitle||""}</div></div>
    </div>`;
  }).join("");
}

// ── HERO SLIDER ────────────────────────────────────────────────────────────
function buildHero(trackId,dotsId,items,oldTimer,clickFn,label){
  const track=document.getElementById(trackId),dots=document.getElementById(dotsId);
  if(!track||!dots||!items.length)return null;
  if(oldTimer)clearInterval(oldTimer);
  track.innerHTML=items.map(i=>`
    <div class="hero-slide">
      <img class="hero-img" src="${IMG(i.thumbnail||i.poster||i.image||i.img||'')}" onerror="this.style.background='var(--surface)'" loading="lazy"/>
      <div class="hero-overlay">
        <div class="hero-badge">✦ ${label||"Populer"}</div>
        <div class="hero-title">${i.title}</div>
        <div class="hero-meta"><span class="hero-type">${label||"DONGHUA"}</span><span style="color:var(--muted)">•</span><span>${i.status||"Ongoing"}</span></div>
      </div>
    </div>`).join("");
  dots.innerHTML=items.map((_,i)=>`<div class="hero-dot${i===0?' active':''}" onclick="goHeroTo('${trackId}','${dotsId}',${i})"></div>`).join("");
  track.querySelectorAll(".hero-slide").forEach((s,i)=>s.onclick=()=>clickFn(items[i]));
  return setInterval(()=>{
    const idx=(parseInt(track.dataset.idx||0)+1)%items.length;
    track.dataset.idx=idx; goHeroTo(trackId,dotsId,idx);
  },4500);
}
function goHeroTo(trackId,dotsId,i){
  const track=document.getElementById(trackId);if(!track)return;
  track.style.transform=`translateX(-${i*100}%)`;track.dataset.idx=i;
  document.querySelectorAll(`#${dotsId} .hero-dot`).forEach((d,idx)=>d.classList.toggle("active",idx===i));
}

// ── RENDER HELPERS ─────────────────────────────────────────────────────────
function renderGrid3(el,items,type){
  if(!items||!items.length){el.innerHTML=`<div class="empty" style="grid-column:1/-1">Tidak ada data</div>`;return}
  el.innerHTML=items.map(i=>gcHTML(i,type)).join("");
}

function gcHTML(i,type){
  const isDH=type==="dh"||type==="donghua";
  const isNN=type==="neonime";
  const isOD=type==="od";
  let fn;
  const thumb=i.thumbnail||i.poster||i.image||i.img||"";
  if(isDH)      fn=`openDetail('${encodeURIComponent(slug(i.url||i.link||""))}')`;
  else if(isNN) fn=`openNNDetail('${encodeURIComponent(nnSlug(i.url||i.link||""))}')`;
  else if(isOD) fn=`openODDetail('${encodeURIComponent(odSlug(i.url||i.link||""))}','${encodeURIComponent(thumb)}')`;
  else          fn=`openNNDetail('${encodeURIComponent(nnSlug(i.url||i.link||""))}')`;
  const ep=i.episode||i.eps||i.status||"";
  const rating=i.rating||i.score||(i.score?`★ ${i.score}`:"");
  const badge=isDH?"NEW":isNN?"NEO":isOD?"OD":"ANIME";
  return`<div class="gc" onclick="${fn}">
    <div class="gc-wrap">
      <img class="gc-img" src="${IMG(thumb)}" onerror="this.style.background='var(--card2)'" loading="lazy"/>
      <div class="gc-badge${isDH?'':' anime'}">${badge}</div>
      ${rating?`<div class="gc-rating">${rating}</div>`:""}
      ${ep?`<div class="gc-overlay"><div class="gc-eps">${ep}</div></div>`:""}
    </div>
    <div class="gc-title">${i.title||""}</div>
  </div>`;
}

function renderPopular(items){
  const el=document.getElementById("home-popular");
  if(!items||!items.length){el.innerHTML="";return}
  el.innerHTML=items.map((i,idx)=>`
    <div class="pop-item" onclick="openDetail('${encodeURIComponent(slug(i.url))}')">
      <span class="pop-rank${idx<3?' t':''}">${String(idx+1).padStart(2,"0")}</span>
      <img class="pop-img" src="${IMG(i.thumbnail)}" onerror="this.style.background='var(--card2)'" loading="lazy"/>

// ── SCHEDULE (Donghua + OtakuDesu digabung) ─────────────────────────────────
const DAY_ORDER=["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"];

async function loadSchedule(){
  scheduleLoaded=true;
  const cachedDH=cacheGet("dh_schedule"), cachedAN=cacheGet("od_schedule");
  if(!(cachedDH&&cachedDH.fresh)||!(cachedAN&&cachedAN.fresh)){
    document.getElementById("sch-body").innerHTML=`<div class="loader"><div class="spinner"></div><div class="ldr-txt">Memuat jadwal...</div></div>`;
  }
  const [dhRes,odRes]=await Promise.allSettled([
    cachedApiGet(DH_API,{cmd:"schedule"},"dh_schedule"),
    cachedApiGet(OD_API,{cmd:"jadwal"},"od_schedule")
  ]);
  scheduleDataDH = dhRes.status==="fulfilled" ? (dhRes.value.result||{}) : {};
  scheduleDataAN = odRes.status==="fulfilled" ? ((odRes.value.data&&odRes.value.data.schedule)||{}) : {};

  const dayKeys=new Set([...Object.keys(scheduleDataDH),...Object.keys(scheduleDataAN)]);
  const days=DAY_ORDER.filter(d=>dayKeys.has(d));
  // tambahkan hari yang gak ada di DAY_ORDER (jaga-jaga beda penamaan)
  dayKeys.forEach(d=>{if(!days.includes(d))days.push(d)});

  if(!days.length){
    document.getElementById("sch-body").innerHTML=`<div class="empty">Tidak ada jadwal</div>`;
    return;
  }
  const todayMap=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
  const todayName=todayMap[new Date().getDay()];
  currentDay=days.includes(todayName)?todayName:days[0];
  document.getElementById("day-tabs").innerHTML=days.map(day=>
    `<button class="day-tab${day===currentDay?' active':''}" onclick="switchDay('${day}')">${day}</button>`).join("");
  renderSchDay(currentDay);
}
function switchDay(day){
  currentDay=day;
  document.querySelectorAll(".day-tab").forEach(b=>b.classList.toggle("active",b.textContent===day));
  renderSchDay(day);
}
function renderSchDay(day){
  const dhItems=scheduleDataDH[day]||[];
  const anItems=scheduleDataAN[day]||[];
  const el=document.getElementById("sch-body");
  if(!dhItems.length&&!anItems.length){el.innerHTML=`<div class="empty">Tidak ada jadwal hari ini</div>`;return}
  let html="";
  if(dhItems.length){
    html+=`<div class="sh" style="padding-top:14px"><span class="sh-title"><span class="dot"></span>Donghua</span></div>
      <div class="grid3" style="padding-bottom:6px">${dhItems.map(i=>gcHTML(i,"dh")).join("")}</div>`;
  }
  if(anItems.length){
    html+=`<div class="sh" style="padding-top:14px"><span class="sh-title"><span class="dot"></span>Anime</span></div>
      <div class="ep-list" style="padding:0 18px 18px">
        ${anItems.map(i=>`
          <div class="ep-row" onclick="openODDetail('${encodeURIComponent(odSlug(i.link||i.url||""))}','')">
            <span class="ep-row-title">${i.title||""}</span>
            <span class="ep-row-arr">›</span>
          </div>`).join("")}
      </div>`;
  }
  el.innerHTML=html;
}

  page.classList.add("open");document.body.style.overflow="hidden";
  try{
    const res=await apiGet(OD_API,{cmd:"detail",slug:s});
    const d=res.data;
    if(!d||!d.title){body.innerHTML=`<div class="empty"><div class="empty-ico">😞</div>Tidak ditemukan</div>`;return}
    document.getElementById("dp-back-title").textContent=d.title;
    const eps=d.episodes||[];
    const info=d.info||{};
    const genres=info.Genre?info.Genre.split(',').map(g=>g.trim()).filter(Boolean):[];
    const poster=thumb; // OtakuDesu detail tidak punya poster, pakai thumbnail dari list/search
    body.innerHTML=`
      ${poster?`<div class="dp-banner"><img class="dp-banner-img" src="${IMG(poster)}" onerror="this.style.display='none'"/></div>`:""}
      <div class="dp-content"${poster?'':' style="padding-top:20px"'}>
        <div class="dp-row"${poster?'':' style="margin-top:0"'}>
          <img class="dp-poster" src="${IMG(poster)}" onerror="this.style.background='var(--card2)'"/>
          <div class="dp-meta"${poster?'':' style="padding-top:0"'}>
            <div class="dp-title">${d.title}</div>
            <div class="dp-tags">
              <span class="dp-tag" style="background:rgba(255,107,107,.12);color:#ff8e8e;border-color:rgba(255,107,107,.3)">Anime</span>
              ${info.Status?`<span class="dp-tag">${info.Status}</span>`:""}
              ${info.Tipe?`<span class="dp-tag">${info.Tipe}</span>`:""}
            </div>
            <div class="dp-stats">
              ${d.score||info.Score?`<div class="dp-stat">⭐ <strong>${d.score||info.Score}</strong></div>`:""}
              ${info["Total Episode"]?`<div class="dp-stat">🎬 <strong>${info["Total Episode"]}</strong></div>`:""}
              ${info.Durasi?`<div class="dp-stat">⏱ <strong>${info.Durasi}</strong></div>`:""}
              ${info["Tanggal Rilis"]?`<div class="dp-stat">📅 <strong>${info["Tanggal Rilis"]}</strong></div>`:""}
            </div>
          </div>
        </div>
        ${genres.length?`<div class="dp-tags" style="margin-bottom:14px">${genres.map(g=>`<span class="dp-tag">${g}</span>`).join('')}</div>`:''}
        ${info.Studio?`<div style="font-size:12px;color:var(--muted);margin-bottom:10px">🏢 Studio: <span style="color:var(--text2)">${info.Studio}</span></div>`:""}
        <div class="ep-list-hd">Daftar Episode <span>(${eps.length})</span></div>
        <div class="ep-list">
          ${eps.map(e=>`
            <div class="ep-row" onclick="openODWatch('${encodeURIComponent(e.url)}','${encodeURIComponent(d.title)}','${encodeURIComponent(poster)}')">
              <span class="ep-row-title">${e.title||d.title}</span>
              <span class="ep-row-date">${e.releaseDate||""}</span>
              <span class="ep-row-arr">›</span>
            </div>`).join("")}
        </div>
      </div>`;
  }catch(e){body.innerHTML=`<div class="empty"><div class="empty-ico">⚠️</div>Gagal: ${e.message}</div>`}
}

// ── DONGHUA WATCH ──────────────────────────────────────────────────────────
async function openWatch(encodedSlug,encodedSeries,encodedThumb){
  const s=decodeURIComponent(encodedSlug);
  const seriesTitle=encodedSeries?decodeURIComponent(encodedSeries):"";
  const thumb=encodedThumb?decodeURIComponent(encodedThumb):"";
  resetWatchUI(seriesTitle);
  document.getElementById("watch-page").classList.add("open");
  try{
    const d=await apiGet(DH_API,{cmd:"watch",slug:s});
    watchData={type:"donghua",...d};
    document.getElementById("wp-back-title").textContent=d.title;
    document.getElementById("wp-ep-title").textContent=d.title;
    const isValid=u=>typeof u==="string"&&/^https?:\/\//i.test(u.trim());
    const url=isValid(d.video_url)?d.video_url:(d.servers||[]).map(sv=>sv.url).find(isValid);
    if(url)document.getElementById("player-frame").src=url;
    const allSrv=[];
    if(isValid(d.video_url))allSrv.push({name:"Default",url:d.video_url});
    (d.servers||[]).forEach(sv=>{if(isValid(sv.url)&&sv.url!==d.video_url)allSrv.push(sv)});
    document.getElementById("srv-list").innerHTML=allSrv.length
      ?allSrv.map((sv,i)=>`<button class="srv-btn${sv.url===url?' active':''}" onclick="switchSrv(this,'${encodeURIComponent(sv.url)}')">${sv.name||"Mirror "+(i+1)}</button>`).join("")
      :`<div style="color:var(--muted);font-size:12.5px;padding:6px 0">⚠️ Tidak ada mirror</div>`;
    document.getElementById("btn-prev-ep").disabled=!d.prev_episode;
    document.getElementById("btn-next-ep").disabled=!d.next_episode;
    if(seriesTitle)addHist(s,d.title,seriesTitle,thumb,"donghua");
  }catch{document.getElementById("srv-list").innerHTML=`<div style="color:var(--muted);font-size:12.5px">⚠️ Gagal memuat player</div>`}
}

// ── NEONIME WATCH (dengan Download) ───────────────────────────────────────
async function openNNWatch(encodedEpUrl,encodedTitle,encodedPoster){
  const epUrl=decodeURIComponent(encodedEpUrl);
  const title=encodedTitle?decodeURIComponent(encodedTitle):"";
  const poster=encodedPoster?decodeURIComponent(encodedPoster):"";
  resetWatchUI(title);
  document.getElementById("watch-page").classList.add("open");

  const parsed=parseNNEp(epUrl);
  if(!parsed){
    document.getElementById("srv-list").innerHTML=`<div style="color:var(--muted);font-size:12.5px">⚠️ URL episode tidak valid</div>`;
    return;
  }
  try{
    const d=await apiGet(NN_API,{cmd:"episode",slug:parsed.slug,ep:parsed.ep});
    document.getElementById("wp-ep-title").textContent=d.title||`Episode ${parsed.ep}`;

    // Stream servers
    const servers=Object.entries(d.streamServers||{}).filter(([,u])=>u&&/^https?:\/\//i.test(u));
    if(servers.length){
      document.getElementById("player-frame").src=servers[0][1];
      document.getElementById("srv-list").innerHTML=servers.map(([name,url],i)=>
        `<button class="srv-btn${i===0?' active':''}" onclick="switchSrv(this,'${encodeURIComponent(url)}')">${name}</button>`
      ).join("");
    } else {
      document.getElementById("srv-list").innerHTML=`<div style="color:var(--muted);font-size:12.5px;padding:6px 0">⚠️ Tidak ada stream tersedia</div>`;
    }

    // Download links
    renderDownloads(d.downloadLinks||[]);

    // Nav & state
    watchData={type:"neonime",slug:parsed.slug,currentEp:parsed.ep,seriesTitle:title,
      next_episode:d.nextEpisode||null,prev_episode:d.prevEpisode||null};
    document.getElementById("btn-prev-ep").disabled=!d.prevEpisode;
    document.getElementById("btn-next-ep").disabled=!d.nextEpisode;

    addHist(epUrl,d.title||`Episode ${parsed.ep}`,title,poster,"neonime");
  }catch{
    document.getElementById("srv-list").innerHTML=`<div style="color:var(--muted);font-size:12.5px">⚠️ Gagal memuat player</div>`;
    document.getElementById("wp-ep-title").textContent="Gagal memuat";
  }
}

// ── OTAKUDESU WATCH (dengan Player asli + Download) ─────────────────────────
async function openODWatch(encodedEpUrl,encodedSeriesTitle,encodedThumb){
  const epUrl=decodeURIComponent(encodedEpUrl);
  const title=encodedSeriesTitle?decodeURIComponent(encodedSeriesTitle):"";
  const thumb=encodedThumb?decodeURIComponent(encodedThumb):"";
  resetWatchUI(title);
  document.getElementById("watch-page").classList.add("open");

  const parsed=parseODEp(epUrl);
  if(!parsed){
    document.getElementById("srv-list").innerHTML=`<div style="color:var(--muted);font-size:12.5px">⚠️ URL episode tidak valid</div>`;
    return;
  }
  try{
    const res=await apiGet(OD_API,{cmd:"episode",slug:parsed.slug,ep:parsed.ep});
    const d=res.data;
    if(!d){throw new Error("Data kosong")}
    document.getElementById("wp-ep-title").textContent=d.title||`Episode ${parsed.ep}`;

    // Kumpulkan semua server (default player + embedPlayers per kualitas)
    const allServers=[];
    if(d.defaultPlayer&&/^https?:\/\//i.test(d.defaultPlayer)){
      allServers.push({label:"Default",url:d.defaultPlayer});
    }
    (d.embedPlayers||[]).forEach(grp=>{
      (grp.servers||[]).forEach(sv=>{
        if(sv.embedUrl&&/^https?:\/\//i.test(sv.embedUrl)){
          allServers.push({label:`${grp.quality} • ${sv.server}`,url:sv.embedUrl});
        }
      });
    });

    if(allServers.length){
      document.getElementById("player-frame").src=allServers[0].url;
      document.getElementById("srv-list").innerHTML=allServers.map((sv,i)=>
        `<button class="srv-btn${i===0?' active':''}" onclick="switchSrv(this,'${encodeURIComponent(sv.url)}')">${sv.label}</button>`
      ).join("");
    } else {
      document.getElementById("srv-list").innerHTML=`<div style="color:var(--muted);font-size:12.5px;padding:6px 0">⚠️ Tidak ada stream tersedia</div>`;
    }

    // Download links (format OtakuDesu: [{quality, servers:[{server,url}]}])
    renderODDownloads(d.downloadLinks||[]);

    // Nav & state
    watchData={type:"od",slug:parsed.slug,currentEp:parsed.ep,seriesTitle:title,
      next_episode:d.nextEpisode||null,prev_episode:d.prevEpisode||null};
    document.getElementById("btn-prev-ep").disabled=!d.prevEpisode;
    document.getElementById("btn-next-ep").disabled=!d.nextEpisode;

    const finalThumb=d.poster||thumb;
    addHist(epUrl,d.title||`Episode ${parsed.ep}`,title,finalThumb,"od");
  }catch(e){
    document.getElementById("srv-list").innerHTML=`<div style="color:var(--muted);font-size:12.5px">⚠️ Gagal memuat player</div>`;
    document.getElementById("wp-ep-title").textContent="Gagal memuat";
  }
}

// ── DOWNLOAD RENDERER (Neonime: format/quality/links) ───────────────────────
function renderDownloads(downloadLinks){
  const sec=document.getElementById("dl-section");
  const content=document.getElementById("dl-content");
  if(!downloadLinks||!downloadLinks.length){sec.style.display="none";return}
  const valid=downloadLinks.filter(d=>(d.links||[]).some(l=>l.url));
  if(!valid.length){sec.style.display="none";return}
  sec.style.display="block";
  const groups={};
  valid.forEach(d=>{const f=d.format||"MP4";if(!groups[f])groups[f]=[];groups[f].push(d)});
  let html="";
  for(const[fmt,items] of Object.entries(groups)){
    html+=`<div class="dl-format-block"><div class="dl-fmt-tag ${fmt.toLowerCase()}">${fmt}</div>`;
    items.forEach(d=>{
      const links=(d.links||[]).filter(l=>l.url);
      if(!links.length)return;
      html+=`<div class="dl-quality-item"><div class="dl-quality-name">${d.quality||""}</div>
        <div class="dl-links-wrap">${links.map(l=>
          `<a class="dl-link-a" href="${l.url}" target="_blank" rel="noopener">⬇ ${l.name||"Download"}</a>`
        ).join("")}</div></div>`;
    });
    html+=`</div>`;
  }
  content.innerHTML=html;
}

// ── DOWNLOAD RENDERER (OtakuDesu: quality/servers) ──────────────────────────
function renderODDownloads(downloadLinks){
  const sec=document.getElementById("dl-section");
  const content=document.getElementById("dl-content");
  if(!downloadLinks||!downloadLinks.length){sec.style.display="none";return}
  const valid=downloadLinks.filter(d=>(d.servers||[]).some(s=>s.url));
  if(!valid.length){sec.style.display="none";return}
  sec.style.display="block";
  let html=`<div class="dl-format-block"><div class="dl-fmt-tag mp4">DOWNLOAD</div>`;
  valid.forEach(d=>{
    const servers=(d.servers||[]).filter(s=>s.url);
    if(!servers.length)return;
    html+=`<div class="dl-quality-item"><div class="dl-quality-name">${d.quality||""}</div>
      <div class="dl-links-wrap">${servers.map(s=>
        `<a class="dl-link-a" href="${s.url}" target="_blank" rel="noopener">⬇ ${s.server||"Download"}</a>`
      ).join("")}</div></div>`;
  });
  html+=`</div>`;
  content.innerHTML=html;
}

// ── WATCH UTILS ────────────────────────────────────────────────────────────
function resetWatchUI(title){
  document.getElementById("wp-back-title").textContent=title||"";
  document.getElementById("wp-ep-title").textContent="Memuat...";
  document.getElementById("wp-series-title").textContent=title||"";
  document.getElementById("player-frame").src="";
  document.getElementById("srv-list").innerHTML=`<div class="loader" style="width:100%"><div class="spinner"></div></div>`;
  document.getElementById("btn-prev-ep").disabled=true;
  document.getElementById("btn-next-ep").disabled=true;
  document.getElementById("dl-section").style.display="none";
  watchData=null;
}
function switchSrv(btn,encodedUrl){
  document.querySelectorAll(".srv-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("player-frame").src=decodeURIComponent(encodedUrl);
}
function navEp(dir){
  if(!watchData)return;
  const url=dir==="next"?watchData.next_episode:watchData.prev_episode;
  if(!url)return;
  if(watchData.type==="neonime"){
    openNNWatch(encodeURIComponent(url),encodeURIComponent(watchData.seriesTitle||""),"");
  } else if(watchData.type==="od"){
    openODWatch(encodeURIComponent(url),encodeURIComponent(watchData.seriesTitle||""),"");
  } else {
    openWatch(encodeURIComponent(slug(url)));
  }
}
function closeWatch(){
  document.getElementById("watch-page").classList.remove("open");
  document.getElementById("player-frame").src="";
  document.getElementById("dl-section").style.display="none";
  watchData=null;renderCW();
}
